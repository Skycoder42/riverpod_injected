name: CI/CD

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  riverpod_injected_ci:
    name: CI
    uses: Skycoder42/dart_test_tools/.github/workflows/dart.yml@main
    with:
      workingDirectory: packages/riverpod_injected
      buildRunner: true
      unitTestPaths: -P unit

  riverpod_injected_cd:
    name: CD
    uses: Skycoder42/dart_test_tools/.github/workflows/release.yml@main
    needs:
      - riverpod_injected_ci
    permissions:
      contents: write
      actions: write
    with:
      workingDirectory: packages/riverpod_injected
      tagPrefix: riverpod_injected-v
      publishWorkflow: riverpod_injected_cd.yaml

  riverpod_injected_generator_ci:
    name: CI
    uses: Skycoder42/dart_test_tools/.github/workflows/dart.yml@main
    with:
      workingDirectory: packages/riverpod_injected_generator
      buildRunner: true
      unitTestPaths: -P unit
      minCoverage: 80
      integrationTestPaths: -P integration

  riverpod_injected_generator_cd:
    name: CD
    uses: Skycoder42/dart_test_tools/.github/workflows/release.yml@main
    needs:
      - riverpod_injected_generator_ci
    permissions:
      contents: write
      actions: write
    with:
      workingDirectory: packages/riverpod_injected_generator
      tagPrefix: riverpod_injected_generator-v
      publishWorkflow: riverpod_injected_generator_cd.yaml

  renovate:
    name: Renovate
    needs:
      - riverpod_injected_ci
      - riverpod_injected_cd
      - riverpod_injected_generator_ci
      - riverpod_injected_generator_cd
    if: ${{ !cancelled() }}
    uses: Skycoder42/dart_test_tools/.github/workflows/renovate-finish.yml@main
    permissions:
      contents: write
      pull-requests: write
      actions: write
    with:
      needs: ${{ toJSON(needs) }}
